[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the backend folder on sys.path so `from app import ...` resolves when
# pytest is invoked as a bare command. Without this, only `python -m pytest`
# works, because that form adds the working directory itself.
pythonpath = ["."]
