<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="caresphere-api" content="http://127.0.0.1:5000" />
    <meta
      name="description"
      content="CareSphere - review your booked consultations, see what is coming up, and cancel a slot you no longer need."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M16 25s-8-5-8-11.4A4.6 4.6 0 0 1 16 10a4.6 4.6 0 0 1 8 3.6C24 20 16 25 16 25z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <title>My appointments — CareSphere</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="siteHeader"></header>

    <main id="main" class="container" style="padding-block: var(--space-8)">
      <div class="page-head">
        <h1>My appointments</h1>
        <p>Everything you have booked, with the most recent first.</p>
      </div>

      <div id="appointmentsRoot">
        <div class="appointment-list">
          <div class="skeleton skeleton-line" style="width: 40%"></div>
          <div class="skeleton skeleton-line" style="width: 70%"></div>
          <div class="skeleton skeleton-line" style="width: 55%"></div>
        </div>
      </div>
    </main>

    <div class="modal-backdrop" id="refundModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="refundTitle">
        <div class="modal-head">
          <h2 id="refundTitle">Request a cancellation</h2>
        </div>
        <div class="modal-body">
          <p class="text-soft" style="margin: 0 0 var(--space-4); font-size: var(--text-sm)">
            Your appointment stays booked until an administrator reviews this. They will arrange the
            refund with you directly.
          </p>
          <div class="field">
            <label for="refundReason">Why do you need to cancel?</label>
            <textarea class="input" id="refundReason" rows="3" maxlength="300"></textarea>
          </div>
          <p class="field-error" id="refundError" hidden></p>
        </div>
        <div class="modal-foot">
          <button class="btn btn-secondary" type="button" id="cancelRefund">Keep it</button>
          <button class="btn btn-danger" type="button" id="confirmRefund">Send request</button>
        </div>
      </div>
    </div>

    <footer id="siteFooter"></footer>
    <script type="module" src="assets/js/pages/appointments.js"></script>
  </body>
</html>
