<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
    <title>Notifications — CareSphere</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="siteHeader"></header>
    <main id="main" class="container">
      <div class="page-head">
        <p class="eyebrow">Your inbox</p>
        <h1>Notifications</h1>
        <p class="lede">Medication alerts and updates from CareSphere.</p>
      </div>
      <section class="card">
        <div class="section-head">
          <h2>Notification history</h2>
          <div>
            <button class="btn btn-secondary btn-sm" id="enableBrowser">
              Enable browser alerts
            </button>
            <button class="btn btn-ghost btn-sm" id="readAll">Mark all as read</button>
          </div>
        </div>
        <p id="permissionStatus" class="notice" aria-live="polite"></p>
        <div id="notifications">Loading…</div>
      </section>
    </main>
    <footer id="siteFooter"></footer>
    <script type="module" src="assets/js/pages/notifications.js"></script>
  </body>
</html>
